[workspace]
resolver = "2"
members = [
    "crates/fastpaste-data",
    "crates/fastpaste-platform",
    "crates/fastpaste-app",
    "crates/fastpaste-gui",
]

[workspace.package]
# The one version of the app: every crate inherits it, the packages and the
# Windows version resource take it from here, and the release workflow
# refuses a `vX.Y.Z` tag that does not match it. See "Releasing" in the
# README.
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/stdex/fastpaste-rs"
homepage = "https://github.com/stdex/fastpaste-rs"
publish = false

# What ships. Thin LTO with one codegen unit gets most of fat LTO's size
# and speed for a fraction of its link time. `strip` drops the symbol
# table: panic messages and logs keep their file and line, only a
# `RUST_BACKTRACE` loses its function names.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
# No default features: the window backend is picked per platform in
# fastpaste-gui (Wayland-only on Linux), and a default `backend-winit`
# here would bring X11 back through feature unification.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "system-tray",
] }
slint-build = "1.17"
slint-tree-view = "0.3.1"
fluent-templates = "0.15"
fluent-syntax = "0.12"
sys-locale = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
secrecy = "0.10"
