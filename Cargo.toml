[workspace]
resolver = "2"
members = [
    "crates/fastpaste-data",
    "crates/fastpaste-platform",
    "crates/fastpaste-app",
    "crates/fastpaste-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
slint = "1.17"
slint-build = "1.17"
slint-tree-view = "0.3.0"
fluent-templates = "0.15"
fluent-syntax = "0.12"
sys-locale = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
