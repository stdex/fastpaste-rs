[package]
name = "fastpaste-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

# Cross-platform clipboard read/write. The watcher is per-platform (see
# the target sections below); arboard only covers get/set.
arboard = "3.6"

# One credential-store API over Secret Service (Linux) and Credential
# Manager (Windows), so this backend needs no cfg of its own — keyring's
# own Cargo.toml target-gates the Linux D-Bus deps and the Windows deps,
# so declaring both feature sets here costs nothing on either platform.
# `sync-secret-service` alone doesn't build: the Secret Service protocol
# encrypts the session over D-Bus, and the D-Bus backend needs a crypto
# implementation picked explicitly. `crypto-rust` (pure Rust: aes, cbc,
# hkdf, sha2) over `crypto-openssl` — this crate has no other reason to
# link OpenSSL, unlike fastpaste-data which already vendors it for
# SQLCipher. `vendored` builds libdbus from source instead of requiring
# system libdbus-1-dev/pkg-config, which is not guaranteed on every
# build or CI machine.
keyring = { version = "3", features = [
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
    "vendored",
] }
secrecy.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
# Native data-control reads/writes on Wayland, matching the transport the
# watcher uses. Windows needs none of this.
arboard = { version = "3.6", features = ["wayland-data-control"] }
# Watching only. arboard's wayland-data-control feature already pulls
# wl-clipboard-rs in for native reads/writes, but that crate has no watch
# API in any published version (verified against docs.rs, 2026-08) — the
# watch surface lives only in the separate wl-clipboard-rs-tools binary.
wl-clipboard-watch = "0.1"
libc = "0.2"   # poll(2) for the hotkey reader's blocking loop
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
# Win32 bindings: RegisterHotKey + a message pump for the hotkeys,
# AddClipboardFormatListener for change notifications, SendInput for the
# paste keystroke.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # WNDCLASSW names GDI handle types, so registering a window class
    # needs this even though nothing here draws.
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

