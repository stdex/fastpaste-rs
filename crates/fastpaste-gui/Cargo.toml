[package]
name = "fastpaste-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fastpaste-gui"
path = "src/main.rs"

[dependencies]
slint.workspace = true
slint-tree-view.workspace = true
fastpaste-app = { path = "../fastpaste-app" }
fastpaste-platform = { path = "../fastpaste-platform" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fluent-templates.workspace = true
sys-locale.workspace = true
fastpaste-data = { path = "../fastpaste-data" }
secrecy.workspace = true

# The window backend, per platform. Linux gets Wayland only: the app
# targets Wayland sessions (see the README), and leaving X11 out drops the
# libX11 family winit would otherwise dlopen. The global hotkeys are not
# affected — they reach XWayland through x11rb, which links nothing.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { workspace = true, features = ["backend-winit-wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
slint = { workspace = true, features = ["backend-winit"] }

[dev-dependencies]
chrono.workspace = true
fluent-syntax.workspace = true
# For the Security-page tests: a real SQLCipher-encrypted temp file, to
# exercise reopen_after_conversion / verify_current_passphrase against
# the actual crypto rather than a mock.
tempfile.workspace = true
# Only the `ui_preview` example needs this: it renders a window to a
# pixel buffer with no display, which requires the software renderer to
# be able to find system fonts. A dev-dependency, so the shipped binary
# is unaffected.
slint = { workspace = true, features = ["software-renderer-systemfonts"] }

[build-dependencies]
slint-build = { workspace = true, features = ["experimental-module-builds"] }
