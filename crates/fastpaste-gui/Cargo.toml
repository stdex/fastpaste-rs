[package]
name = "fastpaste-gui"
description = "Clipboard history and snippet manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "fastpaste-gui"
path = "src/main.rs"

[dependencies]
slint.workspace = true
slint-tree-view.workspace = true
fastpaste-app = { path = "../fastpaste-app" }
fastpaste-platform = { path = "../fastpaste-platform" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fluent-templates.workspace = true
sys-locale.workspace = true
fastpaste-data = { path = "../fastpaste-data" }
secrecy.workspace = true

# The window backend, per platform. Linux gets Wayland only: the app
# targets Wayland sessions (see the README), and leaving X11 out drops the
# libX11 family winit would otherwise dlopen. The global hotkeys are not
# affected — they reach XWayland through x11rb, which links nothing.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { workspace = true, features = ["backend-winit-wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
slint = { workspace = true, features = ["backend-winit"] }

[dev-dependencies]
chrono.workspace = true
fluent-syntax.workspace = true
# For the Security-page tests: a real SQLCipher-encrypted temp file, to
# exercise reopen_after_conversion / verify_current_passphrase against
# the actual crypto rather than a mock.
tempfile.workspace = true
# Only the `ui_preview` example needs this: it renders a window to a
# pixel buffer with no display, which requires the software renderer to
# be able to find system fonts. A dev-dependency, so the shipped binary
# is unaffected.
slint = { workspace = true, features = ["software-renderer-systemfonts"] }

[build-dependencies]
slint-build = { workspace = true, features = ["experimental-module-builds"] }
# The Windows icon and version resource. Unconditional because build.rs
# runs on the host: it checks the *target* at run time, and a dependency
# gated on the target would be missing when it compiles.
winresource = "0.1"

# ---- Packages ----------------------------------------------------------
#
# One binary, built on the oldest supported glibc (the release workflow
# uses ubuntu-22.04), goes into both packages, installed as `fastpaste`.
#
# `$auto` / auto-req only see what the binary links: libfontconfig and
# libc (SQLCipher, OpenSSL and libdbus are built in). winit, glutin and
# xkbcommon-dl dlopen the rest, so those are listed by hand, as measured
# with `LD_DEBUG=libs` under a headless KWin (see "Packaging and
# releases" in AGENTS.md):
#
#   soname                   Debian, Ubuntu       Fedora
#   libwayland-client.so.0   libwayland-client0   libwayland-client
#   libwayland-egl.so.1      libwayland-egl1      libwayland-egl
#   libxkbcommon.so.0        libxkbcommon0        libxkbcommon
#   libEGL.so.1              libegl1              libglvnd-egl
#
# packaging/linux/smoke-test.sh checks the same sonames; keep the three
# lists in step.

[package.metadata.deb]
name = "fastpaste"
maintainer = "stdex <sergey@rostunov.com>"
copyright = "2026, The fastpaste authors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Keeps a history of what you copy and a library of saved snippets, and \
pastes either into the window you were typing in, from a keyboard-driven \
popup. Built for KDE Plasma 6 on Wayland. Installs a udev rule that gives \
the logged-in user access to /dev/uinput, which pasting needs."""
section = "utils"
priority = "optional"
depends = "$auto, libwayland-client0, libwayland-egl1, libxkbcommon0, libegl1"
maintainer-scripts = "../../packaging/linux/scripts/"
assets = [
    ["target/release/fastpaste-gui", "usr/bin/fastpaste", "755"],
    ["../../packaging/linux/fastpaste.desktop", "usr/share/applications/fastpaste.desktop", "644"],
    ["../../packaging/linux/fastpaste-256.png", "usr/share/icons/hicolor/256x256/apps/fastpaste.png", "644"],
    ["../../packaging/linux/fastpaste-32.png", "usr/share/icons/hicolor/32x32/apps/fastpaste.png", "644"],
    ["../../packaging/linux/70-fastpaste-uinput.rules", "usr/lib/udev/rules.d/70-fastpaste-uinput.rules", "644"],
    ["../../README.md", "usr/share/doc/fastpaste/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "fastpaste"
post_install_script = "../../packaging/linux/scripts/postinst"
assets = [
    { source = "target/release/fastpaste-gui", dest = "/usr/bin/fastpaste", mode = "755" },
    { source = "../../packaging/linux/fastpaste.desktop", dest = "/usr/share/applications/fastpaste.desktop", mode = "644" },
    { source = "../../packaging/linux/fastpaste-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/fastpaste.png", mode = "644" },
    { source = "../../packaging/linux/fastpaste-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/fastpaste.png", mode = "644" },
    { source = "../../packaging/linux/70-fastpaste-uinput.rules", dest = "/usr/lib/udev/rules.d/70-fastpaste-uinput.rules", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/fastpaste/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/fastpaste/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
libwayland-client = "*"
libwayland-egl = "*"
libxkbcommon = "*"
libglvnd-egl = "*"
